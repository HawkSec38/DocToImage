name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        # this project is missing gradlew (the wrapper script + jar), which
        # AI Studio's export sometimes drops. Rather than regenerate it,
        # this action installs Gradle straight onto the runner instead.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate a debug keystore
        # your project's .gitignore excludes debug.keystore, so it isn't in the
        # repo. Debug builds still need *a* keystore to sign against, so we
        # create a throwaway one on the runner. Fine for testing/sideloading;
        # don't use this for a Play Store release build.
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        # If the app calls the Gemini API at runtime, add GEMINI_API_KEY as a
        # repo secret (Settings > Secrets and variables > Actions), then
        # uncomment the two lines below.
        run: gradle assembleDebug
        # env:
        #   GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: docview-debug-apk
          path: app/build/outputs/apk/debug/*.apk
